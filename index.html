<!DOCTYPE html>
<html>
<head>
<title>FoodShare</title>
<style>
body{font-family:Arial;background:#f4f4f4;padding:20px;}
.container{background:white;padding:15px;margin:10px;border-radius:10px;}
input{display:block;margin:5px 0;padding:8px;width:100%;}
button{padding:8px;background:orange;color:white;border:none;cursor:pointer;}
.box{background:#eee;padding:10px;margin-top:5px;}
.done{border-left:5px solid green;}
a{margin-left:10px;cursor:pointer;color:blue;text-decoration:underline;}
</style>
</head>

<body>

<h1>🍲 FoodShare</h1>

<!-- DONATION -->
<div class="container">
<h2>Donate</h2>
<form id="donationForm">
<input id="donor" placeholder="Name" required>
<input id="food" placeholder="Food" required>
<input id="quantity" placeholder="Qty" required>
<input id="location" placeholder="Location" required>
<button type="submit">Add</button>
</form>
</div>

<!-- REQUEST -->
<div class="container">
<h2>Request</h2>
<form id="requestForm">
<input id="name" placeholder="Name" required>
<input id="rfood" placeholder="Food" required>
<input id="rquantity" placeholder="Qty" required>
<input id="rlocation" placeholder="Location" required>
<input id="contact" placeholder="Contact" required>
<button type="submit">Request</button>
</form>
</div>

<!-- VOLUNTEER -->
<div class="container">
<h2>Volunteer</h2>
<form id="volunteerForm">
<input id="vname" placeholder="Name" required>
<input id="city" placeholder="City" required>
<input id="phone" placeholder="Phone" required>
<button type="submit">Join</button>
</form>
</div>

<!-- DATA -->
<div class="container">
<h2>Donations</h2>
<div id="donations"></div>
</div>

<div class="container">
<h2>Requests</h2>
<div id="requests"></div>
</div>

<div class="container">
<h2>Volunteers</h2>
<div id="volunteers"></div>
</div>

<div class="container">
<h2>Notifications</h2>
<div id="notifications"></div>
</div>

<script>
let donations = [];
let requests = [];
let volunteers = [];
let notifications = [];

function render() {
    document.getElementById("donations").innerHTML = donations.map((d,i)=>`
        <div class="box">
        🍲 ${d.food} | ${d.quantity} | ${d.location}
        <a onclick="deleteDonation(${i})">❌</a>
        </div>
    `).join("");

    document.getElementById("requests").innerHTML = requests.map((r,i)=>`
        <div class="box ${r.fulfilled ? 'done' : ''}">
        ${r.food} | ${r.quantity} | ${r.location}
        ${!r.fulfilled ? `<a onclick="fulfill(${i})">Serve</a>` : ""}
        <a onclick="deleteRequest(${i})">❌</a>
        </div>
    `).join("");

    document.getElementById("volunteers").innerHTML = volunteers.map((v,i)=>`
        <div class="box">
        ${v.name} | ${v.city}
        <a onclick="deleteVolunteer(${i})">❌</a>
        </div>
    `).join("");

    document.getElementById("notifications").innerHTML = notifications.map(n=>`
        <div class="box">${n}</div>
    `).join("");
}

document.getElementById("donationForm").onsubmit = function(e){
    e.preventDefault();
    donations.push({
        donor: donor.value,
        food: food.value,
        quantity: quantity.value,
        location: location.value
    });
    notifications.push("Donation added successfully");
    this.reset();
    render();
};

document.getElementById("requestForm").onsubmit = function(e){
    e.preventDefault();
    requests.push({
        name: name.value,
        food: rfood.value,
        quantity: rquantity.value,
        location: rlocation.value,
        contact: contact.value,
        fulfilled: false
    });
    notifications.push("Request added successfully");
    this.reset();
    render();
};

document.getElementById("volunteerForm").onsubmit = function(e){
    e.preventDefault();
    volunteers.push({
        name: vname.value,
        city: city.value,
        phone: phone.value
    });
    notifications.push("Volunteer joined successfully");
    this.reset();
    render();
};

function deleteDonation(i){
    donations.splice(i,1);
    render();
}

function deleteRequest(i){
    requests.splice(i,1);
    render();
}

function deleteVolunteer(i){
    volunteers.splice(i,1);
    render();
}

function fulfill(i){
    requests[i].fulfilled = true;
    notifications.push("Request fulfilled successfully");
    render();
}

render();
</script>

</body>
</html>
